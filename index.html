<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="得物利润">
<meta name="theme-color" content="#f5f6f7">
<title>得物利润计算器</title>
<style>
  :root{
    --bg:#f5f6f7; --card:#fff; --text:#1f1f1f; --muted:#6b6b6b;
    --line:#e6e8ea; --green:#1a7f37; --red:#c62828; --amber:#b26a00; --brand:#2e7d32;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding:max(14px,env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));}
  h1{font-size:20px;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
  .modes{display:flex;background:#e9ecee;border-radius:11px;padding:3px;margin-bottom:12px}
  .modes button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;
    font-size:13.5px;color:var(--muted);font-family:inherit;font-weight:600}
  .modes button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .hint{font-size:11.5px;color:var(--muted);margin:-6px 0 10px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field label{font-size:12.5px;color:var(--muted)}
  .field input{font-size:22px;font-weight:600;padding:12px 14px;border:1.5px solid var(--line);
    border-radius:11px;background:#fbfbfc;color:var(--text);width:100%;outline:none;
    -webkit-appearance:none;appearance:none}
  .field input:focus{border-color:var(--brand);background:#fff}
  .netcard{background:linear-gradient(180deg,#f2fbf4,#eaf6ec);border-color:#cfe9d4}
  .netlabel{font-size:13px;color:var(--muted)}
  .net{font-size:44px;font-weight:800;line-height:1.15;margin:2px 0;letter-spacing:-1px}
  .nethint{font-size:12.5px;color:var(--muted)}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid #f1f3f4}
  .row:last-child{border-bottom:0}
  .row .k{font-size:13.5px;color:var(--muted)}
  .row .v{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .row.total .k{color:var(--text);font-weight:600}
  .row.total .v{font-size:17px}
  .row.hide{display:none}
  .sep{height:1px;background:var(--line);margin:4px 0}
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
  details summary{padding:13px 0;font-size:13.5px;color:var(--muted);cursor:pointer;list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:"›";float:right}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:14px}
  .grid2 .field{margin-bottom:0}
  .grid2 input{font-size:16px;padding:10px 12px}
  .btn{display:inline-block;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-size:13.5px;color:var(--text);cursor:pointer}
  .foot{color:#a5a5a5;font-size:11px;text-align:center;margin-top:10px;line-height:1.6}
  .neg{color:var(--red)} .pos{color:var(--green)} .thin{color:var(--amber)}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
</head>
<body>

<h1>得物利润计算器</h1>
<p class="sub">填得物上的数字 + 拿货价 + 运费，实时算净利润</p>

<div class="modes">
  <button id="m-income" class="on" type="button">按预计收入算</button>
  <button id="m-price" type="button">按售价估算</button>
</div>
<p class="hint" id="hint">在得物 App「出售 → 预计收入」页直接抄金额，最准</p>

<div class="card">
  <div class="field">
    <label for="main" id="lbl-main">预计收入（元）</label>
    <input id="main" type="text" inputmode="decimal" placeholder="例如 423.4" autocomplete="off">
  </div>
  <div class="field">
    <label for="cost">拿货价（元）</label>
    <input id="cost" type="text" inputmode="decimal" placeholder="例如 381" autocomplete="off">
  </div>
  <div class="field">
    <label for="ship">运费（元）</label>
    <input id="ship" type="text" inputmode="decimal" value="10" autocomplete="off">
  </div>
</div>

<div class="card netcard">
  <div class="netlabel">净利润</div>
  <div class="net" id="net">—</div>
  <div class="nethint" id="nethint">填上面两个数字就能算</div>
</div>

<div class="card">
  <div class="row hide" id="r-price"><span class="k">商品价格</span><span class="v" id="v-price">—</span></div>
  <div class="row hide" id="r-tech"><span class="k">技术服务费 <span id="v-techrate"></span></span><span class="v" id="v-tech">—</span></div>
  <div class="row hide" id="r-trans"><span class="k">转账手续费 <span id="v-transrate"></span></span><span class="v" id="v-trans">—</span></div>
  <div class="row hide" id="r-op"><span class="k">操作服务费</span><span class="v" id="v-op">—</span></div>
  <div class="row hide" id="r-after"><span class="k">售后无忧服务费 <span id="v-afterrate"></span></span><span class="v" id="v-after">—</span></div>
  <div class="sep hide" id="sep1"></div>
  <div class="row total"><span class="k">预计收入</span><span class="v" id="v-income">—</span></div>
  <div class="row"><span class="k">拿货价</span><span class="v" id="v-cost">—</span></div>
  <div class="row"><span class="k">运费</span><span class="v" id="v-ship">—</span></div>
  <div class="sep"></div>
  <div class="row total"><span class="k" id="k-breakeven">保本收入</span><span class="v" id="v-breakeven">—</span></div>
</div>

<details id="feepanel" class="hide">
  <summary>费率设置（技术费按类目 1%–10%，因商品/活动而异）</summary>
  <div class="grid2">
    <div class="field"><label for="f-tech">技术服务费 %</label><input id="f-tech" type="text" inputmode="decimal" value="5"></div>
    <div class="field"><label for="f-trans">转账手续费 %</label><input id="f-trans" type="text" inputmode="decimal" value="1"></div>
    <div class="field"><label for="f-after">售后无忧 %</label><input id="f-after" type="text" inputmode="decimal" value="0"></div>
    <div class="field"><label for="f-op">操作服务费 元/单</label><input id="f-op" type="text" inputmode="decimal" value="38"></div>
  </div>
  <div style="padding-bottom:14px"><span class="btn" id="reset">恢复默认</span></div>
</details>

<p class="foot" id="foot">净利润 = 预计收入 − 拿货价 − 运费（预计收入已包含得物全部扣费）</p>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var DEFAULTS = {tech:5, trans:1, after:0, op:38};
  var KEY = 'dewu_calc_v2';
  var mode = 'income';

  function num(v){
    if (v === null || v === undefined) return null;
    v = String(v).replace(/[¥,\s]/g,'');
    if (v === '') return null;
    var n = Number(v);
    return isFinite(n) ? n : null;
  }
  function money(n){ return (n < 0 ? '-¥' : '¥') + Math.abs(n).toFixed(2); }
  function pct(n){ return (n % 1 === 0 ? n.toFixed(0) : n.toFixed(1)) + '%'; }
  function fees(){
    return {
      tech: (num($('f-tech').value) || 0) / 100,
      trans: (num($('f-trans').value) || 0) / 100,
      after: (num($('f-after').value) || 0) / 100,
      op: num($('f-op').value) || 0
    };
  }

  function setMode(m){
    mode = m;
    var income = (m === 'income');
    $('m-income').className = income ? 'on' : '';
    $('m-price').className = income ? '' : 'on';
    $('lbl-main').textContent = income ? '预计收入（元）' : '得物售价（元）';
    $('main').placeholder = income ? '例如 423.4' : '例如 491';
    $('hint').textContent = income
      ? '在得物 App「出售 → 预计收入」页直接抄金额，最准'
      : '按四项费用估算；费率因商品/活动而异，可在下面改';
    ['r-price','r-tech','r-trans','r-op','r-after','sep1'].forEach(function(id){
      $(id).classList.toggle('hide', income);
    });
    $('feepanel').classList.toggle('hide', income);
    $('k-breakeven').textContent = income ? '保本收入' : '保本售价';
    $('foot').textContent = income
      ? '净利润 = 预计收入 − 拿货价 − 运费（预计收入已包含得物全部扣费）'
      : '费用口径：技术服务费(类目费率) + 转账 1% + 操作服务费 38 元/单 + 售后无忧';
    calc();
  }

  function calc(){
    var v = num($('main').value), c = num($('cost').value), s = num($('ship').value);
    if (s === null) s = 10;
    var f = fees();
    $('v-techrate').textContent = '(' + pct(f.tech*100) + ')';
    $('v-transrate').textContent = '(' + pct(f.trans*100) + ')';
    $('v-afterrate').textContent = '(' + pct(f.after*100) + ')';

    if (v === null || c === null){
      $('net').textContent = '—'; $('net').className = 'net';
      $('nethint').textContent = '填上面两个数字就能算';
      ['v-price','v-tech','v-trans','v-op','v-after','v-income','v-cost','v-ship','v-breakeven']
        .forEach(function(id){ $(id).textContent = '—'; });
      return;
    }

    var income, breakeven, price = null;
    if (mode === 'income'){
      income = v;
      breakeven = c + s;
    } else {
      price = v;
      var tech = price*f.tech, trans = price*f.trans, after = price*f.after, op = f.op;
      income = price - (tech + trans + after + op);
      var rate = f.tech + f.trans + f.after;
      breakeven = rate < 1 ? (c + s + op) / (1 - rate) : 0;
      $('v-price').textContent = money(price);
      $('v-tech').textContent = '-' + money(tech).replace('-','');
      $('v-trans').textContent = '-' + money(trans).replace('-','');
      $('v-op').textContent = '-' + money(op).replace('-','');
      $('v-after').textContent = '-' + money(after).replace('-','');
    }
    var net = income - c - s;

    $('net').textContent = money(net);
    $('net').className = 'net ' + (net >= 30 ? 'pos' : (net >= 0 ? 'thin' : 'neg'));
    $('nethint').textContent = net >= 30 ? '这单利润不错'
      : (net >= 0 ? '能赚，但比较薄' : '按这个价卖会亏 ' + money(-net));
    $('v-income').textContent = money(income);
    $('v-cost').textContent = '-' + money(c).replace('-','');
    $('v-ship').textContent = '-' + money(s).replace('-','');
    $('v-breakeven').textContent = money(breakeven) + (mode === 'income' ? '（= 拿货 + 运费）' : '（低于它必亏）');
    save();
  }

  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        mode: mode, main: $('main').value, cost: $('cost').value, ship: $('ship').value,
        tech: $('f-tech').value, trans: $('f-trans').value,
        after: $('f-after').value, op: $('f-op').value
      }));
    }catch(e){}
  }
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || '{}');
      if (d.main !== undefined) $('main').value = d.main;
      if (d.cost !== undefined) $('cost').value = d.cost;
      if (d.ship !== undefined) $('ship').value = d.ship;
      $('f-tech').value = d.tech !== undefined ? d.tech : DEFAULTS.tech;
      $('f-trans').value = d.trans !== undefined ? d.trans : DEFAULTS.trans;
      $('f-after').value = d.after !== undefined ? d.after : DEFAULTS.after;
      $('f-op').value = d.op !== undefined ? d.op : DEFAULTS.op;
      if (d.mode === 'price') { setMode('price'); return; }
    }catch(e){}
    setMode('income');
  }

  $('m-income').addEventListener('click', function(){ setMode('income'); });
  $('m-price').addEventListener('click', function(){ setMode('price'); });
  ['main','cost','ship','f-tech','f-trans','f-after','f-op'].forEach(function(id){
    var el = $(id);
    el.addEventListener('input', calc);
    el.addEventListener('change', calc);
    el.addEventListener('focus', function(){ setTimeout(function(){ el.select && el.select(); }, 30); });
  });
  $('reset').addEventListener('click', function(){
    $('f-tech').value = DEFAULTS.tech; $('f-trans').value = DEFAULTS.trans;
    $('f-after').value = DEFAULTS.after; $('f-op').value = DEFAULTS.op;
    calc();
  });

  load();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
